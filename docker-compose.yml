name: clickstream

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: clickstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    build:
      context: .
      dockerfile: init/kafka/Dockerfile
    container_name: clickstream-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: clickstream-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy

  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: clickstream-spark-master
    ports:
      - "8080:8080"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  spark-worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: clickstream-spark-worker
    ports:
      - "8081:8081"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    depends_on:
      spark-master:
        condition: service_healthy

  spark-submit:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: clickstream-spark-submit
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RAW: clicks.raw
      KAFKA_TOPIC_DLQ: clicks.dlq
      SPARK_SINK_MODE: all
      SPARK_CHECKPOINT_LOCATION: /tmp/clickstream-checkpoints
      POSTGRES_HOST: postgres
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click
      POSTGRES_DB: clickstream
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: click
      CLICKHOUSE_PASSWORD: click
      CLICKHOUSE_DATABASE: olap
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      - /opt/clickstream/spark_jobs/streaming_job.py
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16.4
    container_name: clickstream-postgres
    environment:
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click
      POSTGRES_DB: clickstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U click -d clickstream"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickstream-clickhouse
    environment:
      CLICKHOUSE_DB: olap
      CLICKHOUSE_USER: click
      CLICKHOUSE_PASSWORD: click
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: clickstream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: clickstream-api
    ports:
      - "8000:8000"
    environment:
      API_PORT: "8000"
      POSTGRES_HOST: postgres
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click
      POSTGRES_DB: clickstream
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: click
      CLICKHOUSE_PASSWORD: click
      CLICKHOUSE_DATABASE: olap
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: clickstream-spark
      KAFKA_LAG_REFRESH_SECONDS: "15"
      KAFKA_LAG_TOPICS: clicks.raw,clicks.dlq
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: clickstream-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCER_TOPIC: clicks.raw
      PRODUCER_RATE: "100"
      PRODUCER_DURATION: "0"
      PRODUCER_MAX_EVENTS: "0"
      PRODUCER_SEED: "42"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: clickstream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      kafka-exporter:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: clickstream-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: clickstream-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Phase 2 (P2-01): Airflow batch orchestration (local demo) ---
  airflow-db-init:
    image: postgres:16.4
    container_name: clickstream-airflow-db-init
    environment:
      PGPASSWORD: click
    command:
      - bash
      - -c
      - >
        psql -h postgres -U click -d clickstream -tAc
        "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1 ||
        psql -h postgres -U click -d clickstream -c
        "CREATE DATABASE airflow OWNER click"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: clickstream-airflow-init
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: oS9sEkKPTWtVUXo93olNCsOhN9jTSMtD4Uc66220Y-Y
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://click:click@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: D-R7EkAHW2NhUTq8HkPk9mws1akDrfAuaH72kTOBdsY
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click
      POSTGRES_DB: clickstream
      FRESHNESS_WINDOW_SECONDS: "60"
      FRESHNESS_MAX_STALE_SECONDS: "180"
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username admin --password admin
         --firstname Click --lastname Admin --role Admin
         --email admin@example.com || true)
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-scheduler:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: clickstream-airflow-scheduler
    environment:
      <<: *airflow-env
    command:
      - airflow
      - scheduler
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: clickstream-airflow-webserver
    ports:
      - "8082:8082"
    environment:
      <<: *airflow-env
    command:
      - airflow
      - webserver
      - --port
      - "8082"
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:

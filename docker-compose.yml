# Local dev scaffold — iterate with DESIGN.md before relying on it.
# TODO: pin image versions, add healthchecks, wire env vars.
services:
  kafka:
    image: apache/kafka:3.7.0          # KRaft single-node (no ZK)
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  spark:
    image: bitnami/spark:3.5
    ports: ["8080:8080", "7077:7077"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click
      POSTGRES_DB: clickstream
    ports: ["5432:5432"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./api                 # TODO: implement FastAPI service
    ports: ["8000:8000"]
    depends_on: [kafka, postgres, redis]

  ai_assistant:
    build: ./ai_assistant        # TODO: implement LLM pipeline-ops assistant
    ports: ["8001:8001"]
    depends_on: [postgres, clickhouse]

  go_ops:
    build: ./go_ops              # TODO: implement Go ops CLI / control-plane service
    ports: ["8002:8002"]
    depends_on: [kafka, redis]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  clickhouse_data:

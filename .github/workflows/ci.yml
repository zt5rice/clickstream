name: CI

# Run once per PR (pull_request) and on main pushes only, so feature-branch
# pushes do not double-spend GitHub Actions minutes.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - README.md
      - "docs/**"
      - "*.md"

permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. a newer push on a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Test
        run: make test

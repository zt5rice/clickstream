# Alert rules for the clickstream pipeline (P1-11 minimal set; P1-12 extends).
groups:
  - name: clickstream
    rules:
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_lag > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag above 5000"
          description: "Consumer group is falling behind: {{ $value }} messages lagging."

      - alert: APIP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1s"
          description: "API p95 latency exceeded 1s over the last 5 minutes."

      - alert: ClickstreamDLQNonEmpty
        expr: sum(kafka_topic_end_offset{topic="clicks.dlq"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "clicks.dlq contains messages"
          description: "Unparseable events have been routed to the dead-letter topic."
